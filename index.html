<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#080f1c">
    <link rel="icon" href="data:,">
    <title>REGULATOR//GHOST — Human in the Right Loop</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="app-shell">
      <div class="stage-identity" aria-hidden="true">REGULATOR<span>//</span>GHOST</div>
      <div id="stageStatus" class="simulation-mark" aria-hidden="true"></div>
      <main id="stage" class="stage" aria-label="Presentation stage"></main>
      <div id="cueAnnouncement" class="sr-only" aria-live="polite"></div>
      <button id="contextButton" class="context-button" type="button" data-action="open-evidence" hidden>Inspect evidence</button>
      <nav class="presenter-control" aria-label="Presenter controls">
        <button id="previousButton" type="button" data-action="previous" aria-label="Previous reveal">←</button>
        <span id="beatCounter" aria-live="polite">BEAT 1/10</span>
        <button id="nextButton" type="button" data-action="next" aria-label="Next reveal">→</button>
      </nav>
    </div>

    <div id="drawer" class="drawer-backdrop" hidden>
      <section class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
        <div class="drawer-header">
          <h2 id="drawerTitle">Evidence</h2>
          <button class="drawer-close" type="button" data-action="close-drawer" aria-label="Close detail panel">×</button>
        </div>
        <div id="drawerBody" class="drawer-body"></div>
      </section>
    </div>

    <noscript>This presentation needs JavaScript to replay its synthetic scenario.</noscript>
    <script type="module" src="/src/theatre.mjs"></script>
  </body>
</html>
