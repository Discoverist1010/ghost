<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#080f1c">
    <link rel="icon" href="data:,">
    <title>Interactive demonstration</title>
    <style>
:root {
  color-scheme: dark;
  --field: #081321;
  --field-deep: #050d18;
  --field-raised: #102034;
  --text: #f4f7fc;
  --secondary: #c0cede;
  --quiet: #8fa4ba;
  --line: #3c526b;
  --cyan: #82d8ed;
  --amber: #f3bb70;
  --red: #f4837c;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; }
html, body { width: 100%; height: 100%; margin: 0; }
body { display: grid; place-items: center; background: #030a13; color: var(--text); overflow: hidden; }
button { font: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--cyan); outline-offset: 5px; }
button:disabled { cursor: default; opacity: .35; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

.presentation-frame { position:absolute; left:50%; top:50%; width:1920px; height:1080px; transform:translate(-50%, -50%) scale(var(--presentation-scale, 1)); transform-origin:center; }
.app-shell { position: relative; width: 100%; height: 100%; aspect-ratio: 16 / 9; container-type: size; background: var(--field); overflow: hidden; }
.stage { position: absolute; inset: 0; overflow: hidden; }
.stage-identity, .narrative-indicator { position: absolute; z-index: 5; top: 34px; white-space: nowrap; }
.stage-identity { left: 5.2cqw; color: var(--secondary); font-size: clamp(17px, 1.15cqw, 21px); font-weight: 690; letter-spacing: .07em; }
.stage-identity span { color: var(--cyan); padding: 0 .1em; }
.narrative-indicator { right: 5.2cqw; display: grid; gap: 6px; color: var(--quiet); font-size: clamp(15px, 1cqw, 19px); font-weight: 650; letter-spacing: .045em; text-align: right; }
.narrative-indicator strong { color: var(--cyan); font-weight: 810; }
.narrative-indicator.is-question { font-weight: 710; }
.narrative-indicator.is-question strong { color: var(--amber); }

.cue { position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; padding: 110px 6cqw 116px; overflow: hidden; }
.stage[data-reveal="no-breach"] .cue, .stage[data-reveal="naive-basis"] .cue, .cue--ghost { background: var(--field-deep); }
.stage[data-reveal="escalate"] .cue { background: #040a12; }
.cue-content { width: min(100%, 1640px); max-height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: clamp(30px, 4cqh, 56px); animation: enter .45s ease-out both; }
.cue.centered .cue-content { align-items: center; text-align: center; }
.cue.flood .cue-content { width: min(100%, 1710px); }
.is-paused *, .is-paused *::before, .is-paused *::after { animation-play-state: paused !important; }

.hero-verdict { max-width: 22ch; margin: 0; color: var(--text); font-size: clamp(64px, 5.1cqw, 90px); line-height: 1.15; font-weight: 840; letter-spacing: -.052em; text-wrap: balance; }
.hero-verdict.wide { max-width: 24ch; }
.hero-verdict.impact { max-width: 24ch; font-size: clamp(70px, 5.5cqw, 96px); }
.hero-verdict.mega { font-size: clamp(116px, 10cqw, 170px); letter-spacing: -.07em; }
.hero-verdict.amber { color: var(--amber); }
.cyan { color: var(--cyan); }
.hero-number { display: inline-block; color: var(--text); font-size: clamp(110px, 10.3cqw, 170px); line-height: .9; font-weight: 840; letter-spacing: -.075em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.hero-number.cyan { color: var(--cyan); }
.hero-number.amber { color: var(--amber); }
.hero-unit { display: block; margin: 0; color: var(--text); font-size: clamp(58px, 5.4cqw, 80px); line-height: 1; font-weight: 820; letter-spacing: -.045em; }
.primary-line { max-width: 38ch; margin: 0; color: var(--text); font-size: clamp(34px, 3cqw, 48px); line-height: 1.38; font-weight: 690; text-wrap: balance; }
.support-line { max-width: 64ch; margin: 0; color: var(--secondary); font-size: clamp(27px, 2.05cqw, 34px); line-height: 1.4; font-weight: 500; text-wrap: balance; }
.closing-line { max-width: 44ch; margin: 0; color: var(--secondary); font-size: clamp(27px, 2.1cqw, 34px); line-height: 1.22; }
.stage-heading { margin: 0; color: var(--text); font-size: clamp(54px, 4cqw, 76px); line-height: 1.03; font-weight: 820; letter-spacing: -.045em; }

.opening-signposts { width: min(100%, 1390px); display: flex; align-items: center; justify-content: space-between; gap: 36px; color: var(--secondary); font-size: clamp(30px, 2.7cqw, 44px); font-weight: 780; letter-spacing: .055em; }
.opening-ladder { display: flex; flex-direction: column; align-items: center; gap: 1px; font-size: clamp(47px, 3.8cqw, 64px); font-weight: 830; line-height: 1.01; letter-spacing: -.045em; }
.opening-ladder i { color: var(--cyan); font-size: .43em; line-height: .75; font-style: normal; font-weight: 500; }
.opening-question { margin: 0; font-size: clamp(54px, 4.5cqw, 76px); line-height: 1.08; letter-spacing: -.05em; }
.opening-answer { margin: 0; color: var(--secondary); font-size: clamp(28px, 2.4cqw, 38px); line-height: 1.4; font-weight: 730; }
.stage[data-reveal="failed-trade"] .cue-content { gap: 0; }
.ops-case { width: 100%; display: flex; flex-direction: column; align-items: center; gap: clamp(12px, 1.7cqh, 20px); }
.ops-case .exception-tree { gap: 4px; }
.ops-case .tree-origin { color: var(--cyan); }
.ops-case .tree-stem { font-size: 38px; }
.ops-case .tree-orchestrator { padding: 4px 20px; font-size: clamp(34px, 2.8cqw, 48px); }
.ops-case .workstreams { margin-top: 12px; }
.ops-case .workstreams span { min-height: 70px; }
.ops-scale { display: flex; justify-content: center; gap: clamp(50px, 7cqw, 130px); color: var(--cyan); font-size: clamp(45px, 4cqw, 68px); line-height: 1; letter-spacing: -.045em; }
.ops-scale { animation: case-rise .6s 1.35s both; }
.ops-help { margin: 0; font-size: clamp(32px, 2.7cqw, 44px); font-weight: 780; animation: case-fade .55s 1.85s both; }
.exception-tree { width: min(100%, 1470px); display: flex; flex-direction: column; align-items: center; gap: 12px; }
.tree-origin { margin: 0; font-size: clamp(52px, 4.7cqw, 76px); font-weight: 820; }
.tree-stem { color: var(--cyan); font-size: 45px; line-height: 1; }
.tree-orchestrator { margin: 0; padding: 12px 30px; color: var(--cyan); font-size: clamp(39px, 3.2cqw, 54px); font-weight: 780; }
.workstreams { width: 100%; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-top: 24px; }
.workstreams span { min-height: 100px; display: flex; align-items: center; justify-content: center; padding: 14px; border-top: 3px solid var(--line); color: var(--text); font-size: clamp(27px, 2cqw, 34px); font-weight: 740; opacity: 0; animation: reveal-node .55s ease-out forwards; animation-delay: var(--delay); }
.cue--systemic .cue-content { width: min(100%, 1680px); height: 100%; max-height: 800px; display: block; animation: none; }
.systemic-stage { width: 100%; height: 100%; display: flex; flex-direction: column; gap: 16px; }
.systemic-head { flex: none; display: flex; align-items: center; justify-content: center; min-height: 70px; }
.systemic-head h1 { margin: 0; font-size: clamp(40px, 3.05cqw, 58px); line-height: 1.08; letter-spacing: -.045em; text-align: center; }
.systemic-network { position: relative; flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(340px, 420px) minmax(0, 1fr); gap: clamp(45px, 4.5cqw, 86px); }
.systemic-agents { min-width: 0; display: grid; grid-template-rows: repeat(3, minmax(0, 1fr)); gap: 12px; }
.systemic-agents--left { grid-column: 1; }
.systemic-agents--right { grid-column: 3; }
.systemic-agent { position: relative; min-width: 0; padding: 17px 22px 13px; border-top: 2px solid var(--line); background: rgba(16, 32, 52, .43); text-align: left; transition: background .45s ease, border-color .45s ease, opacity .45s ease; }
.agent-name { display: block; color: var(--text); font-size: clamp(23px, 1.55cqw, 29px); line-height: 1.05; letter-spacing: .015em; }
.agent-intent, .agent-response, .agent-reoptimise { position: absolute; inset: 43px 18px 36px; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 6px; }
.agent-intent span { font-size: clamp(22px, 1.35cqw, 26px); line-height: 1.13; font-weight: 700; }
.agent-intent small, .agent-reoptimise small { color: var(--quiet); font-size: clamp(18px, 1.15cqw, 22px); line-height: 1.1; }
.agent-mandate { position: absolute; bottom: 12px; left: 22px; color: var(--cyan); font-size: 18px; font-weight: 760; opacity: .3; }
.systemic-agents--right .agent-mandate { right: 22px; left: auto; }
.agent-response, .agent-reoptimise { visibility: hidden; opacity: 0; color: var(--cyan); font-size: clamp(25px, 1.75cqw, 32px); line-height: 1.07; }
.agent-reoptimise { background: var(--field-raised); }
.agent-reoptimise strong { color: var(--cyan); font-size: clamp(24px, 1.65cqw, 30px); line-height: 1.05; }
.agent-flow { position: absolute; top: 50%; width: clamp(45px, 4.5cqw, 86px); height: 44px; margin-top: -22px; color: var(--cyan); font-size: 42px; line-height: 1; text-align: center; visibility: hidden; opacity: 0; pointer-events: none; }
.systemic-agents--left .agent-flow { right: calc(-1 * clamp(45px, 4.5cqw, 86px)); }
.systemic-agents--right .agent-flow { left: calc(-1 * clamp(45px, 4.5cqw, 86px)); }
.systemic-market { position: relative; grid-column: 2; min-width: 0; display: flex; align-items: center; justify-content: center; border-top: 2px solid var(--line); border-bottom: 2px solid var(--line); background: rgba(16, 32, 52, .42); transition: background .5s ease, border-color .5s ease, opacity .5s ease; }
.systemic-market > div { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 17px; visibility: hidden; opacity: 0; text-align: center; }
.market-common strong { color: var(--text); font-size: clamp(43px, 3.05cqw, 57px); line-height: 1; }
.market-common span { color: var(--secondary); font-size: clamp(25px, 1.8cqw, 32px); font-weight: 710; }
.market-signal strong { color: var(--cyan); font-size: clamp(28px, 1.75cqw, 34px); letter-spacing: .07em; }
.market-change-lead { color: var(--text); font-size: clamp(40px, 2.55cqw, 50px); line-height: 1.05; font-weight: 820; letter-spacing: -.045em; }
.market-effects strong { color: var(--cyan); font-size: clamp(23px, 1.45cqw, 29px); letter-spacing: .05em; }
.market-signal span, .market-effects span { color: var(--text); font-size: clamp(28px, 2.05cqw, 39px); line-height: 1.05; font-weight: 770; }
.market-direction { z-index: 2; gap: 0 !important; color: var(--cyan); line-height: .95; font-weight: 850; letter-spacing: -.06em; background: radial-gradient(ellipse 60% 36% at center, rgba(4, 13, 24, .96), rgba(4, 13, 24, .72) 62%, transparent 100%); }
.market-direction span { font-size: clamp(65px, 4.1cqw, 78px); }
.market-direction strong { font-size: clamp(75px, 4.7cqw, 90px); }
.market-feedback { top: auto !important; bottom: 14px; height: 80px; gap: 3px !important; color: var(--cyan); font-size: clamp(22px, 1.4cqw, 27px); line-height: 1.1; font-weight: 790; }
.market-feedback strong { color: var(--cyan); font-size: 1.05em; }
.systemic-footer { position: relative; flex: none; height: 150px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
.systemic-primary { min-height: 66px; min-width: 290px; padding: 11px 28px; border: 2px solid var(--cyan); color: var(--field); background: var(--cyan); font-size: clamp(23px, 1.55cqw, 29px); font-weight: 820; }
.systemic-primary:hover { background: #a6e7f4; }
.systemic-inference, .systemic-cycle, .systemic-feedback-punch { position: absolute; top: 0; left: 0; width: 100%; visibility: hidden; opacity: 0; }
.systemic-inference p, .systemic-inference strong { display: block; margin: 0; line-height: 1.1; }
.systemic-inference p { color: var(--text); font-size: clamp(30px, 2cqw, 38px); font-weight: 800; }
.systemic-inference p span { color: var(--cyan); }
.systemic-inference strong { color: var(--secondary); font-size: clamp(27px, 1.7cqw, 32px); }
.systemic-cycle { color: var(--secondary); font-size: clamp(22px, 1.5cqw, 28px); font-weight: 760; }
.systemic-feedback-punch { color: var(--text); font-size: clamp(46px, 3.4cqw, 66px); line-height: 1; font-weight: 830; letter-spacing: -.045em; }
.systemic-transmission, .systemic-punch, .systemic-bridge { position: absolute; inset: 0; visibility: hidden; opacity: 0; pointer-events: none; }
.systemic-transmission { display: flex; flex-direction: column; align-items: center; width: 100%; text-align: center; }
.transmission-origin { margin: 0; color: var(--secondary); font-size: clamp(21px, 1.35cqw, 26px); font-weight: 750; letter-spacing: .06em; }
.transmission-origin span { color: var(--cyan); margin: 0 .4em; }
.systemic-transmission h2 { margin: 9px 0 15px; color: var(--text); font-size: clamp(37px, 2.55cqw, 49px); line-height: 1.08; letter-spacing: -.045em; }
.transmission-market { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 113px; width: min(100%, 700px); border-top: 2px solid var(--line); border-bottom: 2px solid var(--line); }
.transmission-market strong { color: var(--text); font-size: clamp(34px, 2.5cqw, 48px); line-height: 1.1; }
.transmission-market p { margin: 11px 0 0; color: var(--secondary); font-size: clamp(27px, 1.8cqw, 35px); font-weight: 730; }
.transmission-market p span { color: var(--cyan); padding: 0 .3em; }
.transmission-split, .transmission-join { position: relative; flex: none; width: min(100%, 1380px); height: 61px; color: var(--cyan); }
.transmission-split::before, .transmission-join::after { content: ''; position: absolute; left: 50%; height: 25px; border-left: 3px solid currentColor; }
.transmission-split::before { top: 0; }
.transmission-split::after, .transmission-join::before { content: ''; position: absolute; left: 16.666%; width: 66.668%; border-top: 3px solid currentColor; }
.transmission-split::after { top: 25px; }
.transmission-split span, .transmission-join span { position: absolute; width: 0; border-left: 3px solid currentColor; }
.transmission-split span { top: 25px; height: 36px; }
.transmission-split span:nth-child(1), .transmission-join span:nth-child(1) { left: 16.666%; }
.transmission-split span:nth-child(2), .transmission-join span:nth-child(2) { left: 50%; }
.transmission-split span:nth-child(3), .transmission-join span:nth-child(3) { left: 83.334%; }
.transmission-channels { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); width: min(100%, 1380px); }
.transmission-channel { display: flex; flex-direction: column; align-items: center; min-width: 0; margin: 0 12px; padding: 12px 10px 0; }
.transmission-channel h3 { margin: 0 0 10px; color: var(--text); font-size: clamp(27px, 1.75cqw, 34px); line-height: 1.08; }
.transmission-channel strong { color: var(--text); font-size: clamp(23px, 1.5cqw, 29px); line-height: 1.1; }
.transmission-channel p { margin: 15px 0 0; color: var(--secondary); font-size: clamp(24px, 1.55cqw, 30px); line-height: 1.12; font-weight: 700; }
.transmission-channel > span { color: var(--cyan); font-size: 27px; line-height: 1; }
.transmission-channel .transmission-consequence { margin: 0; color: var(--amber); font-size: clamp(25px, 1.65cqw, 32px); font-weight: 790; }
.transmission-join { height: 58px; margin-top: auto; visibility: hidden; opacity: 0; }
.transmission-join span { top: 0; height: 27px; }
.transmission-join::before { top: 27px; }
.transmission-join::after { top: 27px; height: 31px; }
.transmission-outcome { color: var(--amber); font-size: clamp(45px, 3.3cqw, 64px); line-height: 1.01; font-weight: 840; letter-spacing: -.045em; visibility: hidden; opacity: 0; }
.systemic-punch, .systemic-bridge { display: flex; flex-direction: column; align-items: center; justify-content: center; }
.systemic-punch { gap: 25px; }
.systemic-punch strong { display: block; font-size: clamp(68px, 5.35cqw, 103px); line-height: 1.05; letter-spacing: -.055em; }
.systemic-punch strong:last-child { color: var(--amber); }
.systemic-bridge { gap: 30px; }
.systemic-bridge p, .systemic-bridge h2 { margin: 0; max-width: 33ch; font-size: clamp(33px, 2.4cqw, 46px); line-height: 1.16; letter-spacing: -.025em; }
.systemic-bridge p:first-child { color: var(--secondary); }
.systemic-bridge h2 { color: var(--text); font-size: clamp(59px, 4.2cqw, 80px); letter-spacing: -.05em; }
.systemic-stage[data-phase="0"] .market-common { visibility: visible; opacity: 1; }
.systemic-stage[data-phase="0"] .systemic-agent { opacity: .72; }
.systemic-stage[data-phase="1"] .systemic-head, .systemic-stage[data-phase="2"] .systemic-head { opacity: .22; }
.systemic-stage[data-phase="3"] .systemic-head, .systemic-stage[data-phase="4"] .systemic-head, .systemic-stage[data-phase="5"] .systemic-head, .systemic-stage[data-phase="6"] .systemic-head { display: none; }
.systemic-stage[data-phase="1"] .systemic-agent { opacity: .32; animation: agent-spotlight .9s var(--first-delay) both; }
.systemic-stage[data-phase="1"] .agent-mandate { animation: mandate-recede .35s 2.25s both; }
.systemic-stage[data-phase="1"] .agent-intent span, .systemic-stage[data-phase="2"] .agent-intent { opacity: 0; }
.systemic-stage[data-phase="1"] .agent-intent small { position: absolute; top: 8px; color: var(--quiet); }
.systemic-stage[data-phase="1"] .agent-response { inset: 75px 18px 25px; visibility: visible; animation: case-rise .45s var(--first-delay) both; }
.systemic-stage[data-phase="1"] .agent-flow--first { visibility: visible; animation: decision-link .8s var(--first-delay) both; }
.systemic-stage[data-phase="1"] .systemic-agents--right .agent-flow--first { animation-name: decision-link-reverse; }
.systemic-stage[data-phase="1"] .market-direction { visibility: visible; animation: case-rise .55s 2.3s both; }
.systemic-stage[data-phase="1"] .market-signal { visibility: visible; animation: signal-recede 2.25s both; }
.systemic-stage[data-phase="1"] .systemic-inference { visibility: visible; animation: case-rise .5s 2.7s both; }
.systemic-stage[data-phase="1"] .systemic-inference strong { animation: case-fade .45s 3.1s both; }
.systemic-stage[data-phase="2"] .systemic-agent { opacity: .38; animation: agent-spotlight .9s var(--second-delay) both; }
.systemic-stage[data-phase="2"] .agent-mandate { visibility: hidden; }
.systemic-stage[data-phase="2"] .agent-response { visibility: visible; opacity: 1; }
.systemic-stage[data-phase="2"] .agent-flow--first { visibility: visible; animation: flow-wave .8s var(--first-delay) both; }
.systemic-stage[data-phase="2"] .systemic-agents--right .agent-flow--first { animation-name: flow-wave-reverse; }
.systemic-stage[data-phase="2"] .market-change-lead { visibility: visible; animation: market-lead 1.9s both; }
.systemic-stage[data-phase="2"] .market-effects { visibility: visible; animation: case-rise .65s 1.85s both; }
.systemic-stage[data-phase="2"] .market-feedback { visibility: visible; animation: case-fade .5s 2.55s both; }
.systemic-stage[data-phase="2"] .agent-flow--feedback { visibility: visible; animation: feedback-wave .75s var(--feedback-delay) both; }
.systemic-stage[data-phase="2"] .systemic-agents--right .agent-flow--feedback { animation-name: feedback-wave-reverse; }
.systemic-stage[data-phase="2"] .agent-reoptimise { visibility: visible; animation: case-rise .45s var(--second-delay) both; }
.systemic-stage[data-phase="2"] .agent-flow--second { visibility: visible; color: var(--cyan); font-size: 54px; font-weight: 820; animation: flow-wave .9s var(--second-flow-delay) both; }
.systemic-stage[data-phase="2"] .systemic-agents--right .agent-flow--second { animation-name: flow-wave-reverse; }
.systemic-stage[data-phase="2"] .systemic-cycle { visibility: visible; animation: cycle-brief 1.3s 5.6s both; }
.systemic-stage[data-phase="2"] .systemic-feedback-punch { visibility: visible; animation: case-rise .6s 6.75s both; }
.systemic-stage[data-phase="2"] .systemic-agents, .systemic-stage[data-phase="2"] .systemic-market { animation: state-recede .55s 6.75s both; }
.systemic-stage[data-phase="3"] .systemic-network, .systemic-stage[data-phase="4"] .systemic-network { display: block; }
.systemic-stage[data-phase="3"] .systemic-agents, .systemic-stage[data-phase="4"] .systemic-agents,
.systemic-stage[data-phase="3"] .systemic-market, .systemic-stage[data-phase="4"] .systemic-market { display: none; }
.systemic-stage[data-phase="3"] .systemic-footer, .systemic-stage[data-phase="4"] .systemic-footer { height: 60px; align-items: flex-end; }
.systemic-stage[data-phase="3"] .systemic-primary, .systemic-stage[data-phase="4"] .systemic-primary { min-width: 0; min-height: 48px; padding: 8px 19px; border-width: 1px; color: var(--cyan); background: transparent; font-size: 20px; }
.systemic-stage[data-phase="3"] .systemic-transmission, .systemic-stage[data-phase="4"] .systemic-transmission { visibility: visible; opacity: 1; }
.systemic-stage[data-phase="3"] .transmission-market { animation: case-rise .5s both; }
.systemic-stage[data-phase="3"] .transmission-market p { animation: case-fade .4s .4s both; }
.systemic-stage[data-phase="3"] .transmission-split { animation: case-fade .45s .85s both; }
.systemic-stage[data-phase="3"] .transmission-channel { opacity: 0; animation: case-rise .5s both; }
.systemic-stage[data-phase="3"] .transmission-channel:nth-child(1) { animation-delay: 1.1s; }
.systemic-stage[data-phase="3"] .transmission-channel:nth-child(2) { animation-delay: 1.8s; }

#beatCounter { flex: 1; text-align: center; font-size: clamp(13px, .95cqw, 19px); font-weight: 700; letter-spacing: .14em; white-space: nowrap; }

.drawer-backdrop { position: fixed; inset: 0; z-index: 30; display: flex; justify-content: flex-end; background: rgba(0, 0, 0, .55); }

@keyframes enter { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
@keyframes reveal-node { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }

@keyframes case-rise { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: translateY(0); } }
@keyframes case-land { from { opacity: 0; transform: scale(1.2); } to { opacity: 1; transform: scale(1); } }
@keyframes case-score-after { from { opacity: 0; transform: translateX(-75px) scale(.82); } to { opacity: 1; transform: translateX(0) scale(1); } }
@keyframes case-system-arrive { from { opacity: 0; transform: translateX(-55px); } to { opacity: 1; transform: translateX(0); } }
@keyframes case-source-arrive { from { opacity: 0; transform: translateX(65px); } to { opacity: 1; transform: translateX(0); } }
@keyframes case-collapse-old { from { opacity: 1; transform: translateY(0) scale(1); } to { opacity: .28; transform: translateY(-16px) scale(.7); } }
@keyframes case-collapse-new { from { opacity: 0; transform: translateY(-70px) scale(1.35); } to { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes cf-demote { from { opacity: 1; } to { opacity: .35; } }
@keyframes cf-retract { from { opacity: 1; transform: translateX(0); } to { opacity: .55; transform: translateX(-18px); } }
@keyframes signal-recede { 0% { opacity: 0; } 10%, 45% { opacity: 1; } 75%, 100% { opacity: .09; } }
@keyframes agent-spotlight { 0% { opacity: .32; border-color: var(--line); } 20%, 65% { opacity: 1; border-color: var(--cyan); } 100% { opacity: .52; border-color: var(--line); } }
@keyframes mandate-recede { from { opacity: .16; } to { opacity: .02; } }
@keyframes decision-link { from { opacity: 0; transform: translateX(-10px); } 45% { opacity: 1; } to { opacity: .7; transform: translateX(0); } }
@keyframes decision-link-reverse { from { opacity: 0; transform: translateX(10px); } 45% { opacity: 1; } to { opacity: .7; transform: translateX(0); } }
@keyframes state-recede { from { opacity: 1; } to { opacity: .12; } }
@keyframes market-lead { 0% { opacity: 0; } 15%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes flow-wave { 0% { opacity: 0; transform: translateX(-10px); } 45% { opacity: 1; } 100% { opacity: 0; transform: translateX(10px); } }
@keyframes flow-wave-reverse { 0% { opacity: 0; transform: translateX(10px); } 45% { opacity: 1; } 100% { opacity: 0; transform: translateX(-10px); } }
@keyframes feedback-wave { 0% { opacity: 0; transform: translateX(10px); } 45% { opacity: 1; } 100% { opacity: 0; transform: translateX(-10px); } }

  .workstreams { gap: 8px; }
  .workstreams span { min-height: 78px; font-size: 23px; }

    <script>
(()=>{
"use strict";
const factories={
"theatre.mjs":function(exports,__load){
const {renderHkmaOversightEvidence} = __load("source-notes.mjs");
const {installPresentationScale} = __load("display.mjs");
const {audienceText, audienceEvidence} = __load("audience.mjs");
const {renderArc2, arc2SceneStep, arc2FindingStage, arc2DetailForStep, ARC2_DETAILS, buildArc2Audit, renderArc2Evidence} = __load("central-bank-theatre.mjs");
const {testSourceClassification, verifySanctionsPolicy} = __load("central-bank-scenario.mjs");
const {SETTLEMENT_WORKFLOW} = __load("settlement-workflow.mjs");
const {renderSystemic, renderSystemicBody, renderSystemicEvidence} = __load("systemic-theatre.mjs");
const {renderFinale} = __load("finale.mjs");

const {SYSTEMIC_REVEALS} = __load("systemic-scenario.mjs");
const systemicSceneStep = step => SYSTEMIC_REVEALS.indexOf(CUES[6].steps[step]);
const {renderNav, renderNavEvidence, navRun} = __load("nav-theatre.mjs");
const {AGENT_IDENTITIES, DOMAIN_RULE, submitSourceChallenge, buildRun, EVIDENCE, evaluateGate, supervise, validateRun} = __load("scenario.mjs");
const {BEATS, CASE_ACTIONS, CUES, NARRATIVE_INDICATORS, SYSTEMIC_ACTIONS, SYSTEMIC_ANNOUNCEMENTS, createPresentationState, currentCue, currentReveal, transition} = __load("presentation.mjs");
const run = buildRun();
if (!validateRun(run)) throw new Error("The synthetic run failed its trace contract.");
const finding = supervise(run.events);
const gate = evaluateGate(run.gateInput);
const classification = run.events.find((event) => event.kind === "CLASSIFICATION_CHANGED");
const riskEvent = run.events.find((event) => event.kind === "RISK_UPDATED" && event.parentIds.includes(classification?.id));
const proposalEvent = run.events.find((event) => event.kind === "INTERVENTION_RECOMMENDED" && event.parentIds.includes(riskEvent?.id));
if (!finding?.sourceEventIds.includes(classification?.id) ||
    !finding.sourceEventIds.includes(riskEvent?.id) ||
    !finding.sourceEventIds.includes(proposalEvent?.id) ||
    !run.counterfactual.evidenceIds.includes(EVIDENCE.bankResponse.id) ||
    !EVIDENCE.entityFiling.finding.includes(classification.before) ||
    run.counterfactual.before !== riskEvent.after ||
    run.counterfactual.after !== riskEvent.before ||
    proposalEvent.proposedAction !== run.gateInput.proposedAction ||
    run.gateInput.mandate !== "recommend" ||
    gate.disposition !== "ESCALATE") {
  throw new Error("The presentation has lost its source-event or challenge link.");
}
const stage = document.getElementById("stage");
const beatCounter = document.getElementById("beatCounter");
const announcer = document.getElementById("cueAnnouncement");
const stageStatus = document.getElementById("stageStatus");
const previousButton = document.getElementById("previousButton");
const nextButton = document.getElementById("nextButton");
const contextButton = document.getElementById("contextButton");
const drawer = document.getElementById("drawer");
const drawerTitle = document.getElementById("drawerTitle");
const drawerBody = document.getElementById("drawerBody");

let presentation = createPresentationState();
let floodState = null;
let paused = false;
let sourceChallenge = null;
let classificationTest = null;
let policyResult = null;
let focusBeforeDrawer = null;
const review = { classification: "pending", intervention: "pending", openedEvidence: false, challenged: false };

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, (character) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  })[character]);
}

function wrap(id, content, modifier = "") {
  return '<article class="cue cue--' + id + ' ' + modifier + '"><div class="cue-content">' + content + "</div></article>";
}

function number(value, tone = "") {
  return '<span class="hero-number ' + tone + '">' + escapeHTML(value) + "</span>";
}

function button(label, action, className = "quiet-button") {
  return '<button type="button" class="' + className + '" data-action="' + action + '">' + label + "</button>";
}

function renderTree() {
  const workstreams = [
    ['TRADE DATA', 'T-09'], ['SETTLEMENT', 'T-11'], ['ENTITY GRAPH', 'T-17'],
    ['CASH', 'T-14'], ['COUNTERPARTY', 'T-06'], ['MARKET RULE', 'T-07'],
    ['DISCLOSURE', 'T-05'], ['AUDIT', 'T-24'],
  ];
  if (!workstreams.every(([, taskId]) => run.tasks.some((task) => task.id === taskId))) {
    throw new Error('A displayed workstream is not linked to a synthetic task.');
  }
  return '<div class="exception-tree"><p class="tree-origin">1 FAILED TRADE</p>' +
    '<div class="tree-stem" aria-hidden="true">↓</div><p class="tree-orchestrator">INVESTIGATOR</p>' +
    '<div class="workstreams">' + workstreams.map(([label, taskId], index) =>
      '<span style="--delay:' + (index * 120) + 'ms" data-task-id="' + taskId + '">' + label + '</span>'
    ).join('') + '</div></div>';
}

function renderMaterialCase(step) { return renderArc2(arc2SceneStep(step),arc2FindingStage(step)); }

const gateChecks = [
  ["IDENTITY + MANDATE", run.gateInput.verifiedIdentity && run.gateInput.mandate === "recommend" ? "VERIFIED ✓ · RECOMMEND ONLY" : "NOT VERIFIED"],
  ["ACTION + MATERIALITY", run.gateInput.proposedAction === "restrict_activity" && run.gateInput.materiality === "high" ? "RESTRICT LIQUIDITY · HIGH" : "CHECK PROPOSAL"],
  ["EVIDENCE", run.gateInput.evidenceQuality.toUpperCase()],
  ["EXECUTION AUTHORITY", gate.disposition === "ESCALATE" ? "INSUFFICIENT" : gate.disposition],
];

function renderView(id, step) {
  switch (id) {
    case "opening":
      if (step === 0) return wrap(id,
        '<p class="opening-eyebrow">THE QUESTION</p>' +
        '<h1 class="opening-title"><span>WHEN AI STARTS ACTING,</span><strong>WHO IS THE SUPERVISOR?</strong></h1>' +
        '<div class="opening-rule" aria-hidden="true"></div>' +
        '<p class="opening-domains">OPERATIONS · FUND ACCOUNTING · LIQUIDITY MANAGEMENT</p>', 'centered');
      step -= 1;
      if (step >= 1 && step <= 4) {
        const technologies = ['RULES', 'ML PATTERN DETECTION', 'LLM INVESTIGATION', 'AGENTS'];
        const descriptions = ['DETERMINISTIC CHECKS', 'RECOGNISE UNUSUAL PATTERNS', 'EXPLAIN. QUESTION. INVESTIGATE.', 'AGENTS WITH OR WITHOUT AUTHORITY'];
        return wrap(id, '<div class="technology-path">' + technologies.slice(0, step).map((name, i) => '<span class="' + (i === step - 1 ? 'active' : '') + '">' + name + '</span>').join('<i>→</i>') + '</div>' + (step === 3 ? '<h1 class="hero-verdict wide">LLM CHECKS AND RECOMMENDS</h1><p class="support-line">RULES FLAG A MISMATCH.<br>ML SPOTS RECURRING PATTERNS.</p>' : '<h1 class="hero-verdict">' + descriptions[step - 1] + '</h1><p class="support-line">' + (step === 1 ? 'RULES REMAIN APPROPRIATE FOR DETERMINISTIC CHECKS.' : step === 4 ? 'AI BEGINS SUPERVISING AI' : 'CAPABILITIES WORK TOGETHER.') + '</p>') + (step === 1 ? '<p class="custody-rule-example">CUSTODY EXAMPLE: REQUIRED ACCOUNT AND SETTLEMENT-DATE FIELDS PRESENT?<br><strong>YES → PASS · NO → FLAG</strong></p>' : ''), 'centered');
      }
      return wrap(id, step === 0 ?
        '<h1 class="hero-verdict wide">ARTIFICIAL INTELLIGENCE IN FINANCE<br>IS MOVING FROM RULES<br>TO <span class="cyan">GENERATIVE AND AUTONOMY</span></h1>' +
        '<p class="opening-loop-question">WHAT IS HUMAN-IN-THE-LOOP</p>' :
        '<div class="opening-ladder"><span>ASSIST</span><i>↓</i><span>INVESTIGATE</span><i>↓</i><span>ASSESS</span><i>↓</i><span>ACT</span></div>' +
        '<h1 class="opening-question">AUTONOMOUS TO DO WHAT?</h1>' +
        '<p class="opening-answer">NOT HOW INTELLIGENT THE AI IS.<br>HOW MUCH AUTHORITY ACCOMPANIES IT.</p>', "centered");
    case "operations":
      if (step === 0) return wrap(id,
        '<div class="ops-case">' + renderTree() +
        '<div class="ops-scale"><strong>' + run.agents.length + ' AGENTS</strong><strong>' + run.tasks.length + ' SUB-TASKS</strong></div>' +

function renderCue(forceReplay = false) {
  stopAnimations();
  paused = false;
  stage.classList.remove("is-paused");
  const cue = currentCue(presentation);
  const persistentSystemic = !forceReplay && cue.id === 'systemic' && stage.dataset.cue === 'systemic' && stage.querySelector?.('.systemic-stage');
  stage.dataset.cue = cue.id;
  stage.dataset.reveal = currentReveal(presentation);
  if (persistentSystemic) {
    persistentSystemic.dataset.phase = currentReveal(presentation);
    persistentSystemic.innerHTML = renderSystemicBody(systemicSceneStep(presentation.step));
  } else {
    stage.innerHTML = renderView(cue.id, presentation.step);
  }
  const indicator = NARRATIVE_INDICATORS[presentation.cueIndex];
  stageStatus.innerHTML = (currentReveal(presentation) === 'rules' ? '<span><strong>NOT AI</strong></span>' : '<span>AI ROLE: <strong>' + indicator.role + '</strong></span>') +
    '<span>' + indicator.label + ': <strong>' + indicator.value + '</strong></span>';
  stageStatus.classList.toggle('is-question', presentation.cueIndex >= 4);
  document.querySelector('.app-shell').classList.toggle('is-closing', cue.id === 'ghost');
  document.querySelector('.app-shell').classList.toggle('is-opening', currentReveal(presentation) === 'opening-question');
  document.querySelector('.app-shell').classList.toggle('is-nav', cue.id === 'nav');
  beatCounter.textContent = "BEAT " + (presentation.cueIndex + 1) + "/" + BEATS.length;
  announcer.textContent = "Beat " + (presentation.cueIndex + 1) + ": " + BEATS[presentation.cueIndex] + ". " +
    (cue.id === 'systemic' ? SYSTEMIC_ANNOUNCEMENTS[presentation.step] : currentReveal(presentation).replaceAll("-", " "));
  previousButton.disabled = presentation.cueIndex === 0 && presentation.step === 0;
  nextButton.disabled = ["causal-explanation","policy-question"].includes(currentReveal(presentation)) || presentation.cueIndex === CUES.length - 1 && presentation.step === cue.steps.length - 1;
  nextButton.setAttribute("aria-label", cue.id === "material-case" ? CASE_ACTIONS[presentation.step] :
    cue.id === 'systemic' ? SYSTEMIC_ACTIONS[presentation.step] : "Next reveal");
  const detail = detailAction(cue.id, presentation.step);
  contextButton.hidden = !detail || cue.id === "material-case";
  if (detail) {
    contextButton.textContent = detail[0];
    contextButton.dataset.action = detail[1];
  }
  if (currentReveal(presentation) === "event-flood") startFlood();
  syncMotionControls();
}

function move(action) {
  const next = transition(presentation, action);
  if (next === presentation) return;
  closeDrawer();
  if (action === 'check-source') sourceChallenge = submitSourceChallenge(run, next.sourceCheck);
  if (next.cueIndex === 4 && next.step === 2) {
    classificationTest = testSourceClassification(run, sourceChallenge);
    if (!classificationTest) return;
  }
  if (action === 'check-policy') {
    policyResult = verifySanctionsPolicy({request:next.policyCheck});
    if (policyResult?.status !== 'MATCH_REQUIRES_AUTHORISED_HANDLING') return;
  }
  if (action === 'reset-beat' && currentCue(presentation).id === 'material-case') { sourceChallenge = null; classificationTest = null; policyResult = null; }
  presentation = next;
  renderCue();
}

function formatTraceLine(event) {
  return String(event.atMs).padStart(4, "0") + "ms  " + event.id + "  " +
    event.agentId + "  " + event.taskId + "  " + event.kind;
}

function appendFloodEvents(count) {
  if (!floodState || count <= floodState.shown) return;
  const lines = document.getElementById("floodLines");
  if (!lines) return;
  const fragment = document.createDocumentFragment();
  for (let index = floodState.shown; index < count; index++) {
    const event = run.events[index];
    const line = document.createElement("div");
    line.className = "log-line";
    line.textContent = formatTraceLine(event);
    fragment.appendChild(line);
  }
  lines.appendChild(fragment);
  lines.scrollTop = lines.scrollHeight;
  floodState.shown = count;
  document.getElementById("floodCount").textContent =
    String(count).padStart(3, "0") + " / " + run.events.length;
}

function updateFlood(elapsed) {
  const duration = run.events.at(-1).atMs;
  const phase = elapsed < 750 ? [run.agents.length, "AGENTS"] :
    elapsed < 1500 ? [run.tasks.length, "SUB-TASKS"] :
    elapsed < 2400 ? [run.events.length, "TRACE EVENTS"] :
    [(duration / 1000).toFixed(1), "SECONDS"];
  document.getElementById("floodNumber").textContent = phase[0];
  document.getElementById("floodUnit").textContent = phase[1];
  appendFloodEvents(Math.min(run.events.length, Math.floor(elapsed / duration * run.events.length)));
}

function floodTick(now) {
  if (!floodState || paused) return;
  const duration = run.events.at(-1).atMs;
  const elapsed = Math.min(duration, floodState.elapsed + now - floodState.startedAt);
  updateFlood(elapsed);
  if (elapsed < duration) floodState.requestId = requestAnimationFrame(floodTick);
  else {
    appendFloodEvents(run.events.length);
    floodState.elapsed = duration;
    floodState.requestId = null;
    syncMotionControls();
  }
}

function startFlood() {
  floodState = { startedAt: performance.now(), elapsed: 0, shown: 0, requestId: null };
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    updateFlood(run.events.at(-1).atMs);
    appendFloodEvents(run.events.length);
    floodState.elapsed = run.events.at(-1).atMs;
  } else {
    floodState.requestId = requestAnimationFrame(floodTick);
  }
}

function hasActiveMotion() {
  if (floodState && floodState.elapsed < run.events.at(-1).atMs && (paused || floodState.requestId)) return true;
  return (stage.getAnimations?.({ subtree: true }) ?? []).some(animation =>
    animation.playState !== 'finished' && animation.playState !== 'idle');
}

function syncMotionControls() {
  const opening = currentReveal(presentation) === 'opening-question';
  const active = hasActiveMotion();
  document.getElementById('pauseButton').disabled = opening || paused || !active;
  document.getElementById('playButton').disabled = !opening && (!paused || !active);
}

function pauseOrResume() {
  if (!hasActiveMotion() || currentReveal(presentation) === 'opening-question') return;
  paused = !paused;
  stage.classList.toggle("is-paused", paused);
  const clock = performance.now();
  for (const animation of [floodState]) {
    if (!animation) continue;
    if (paused) {
      animation.elapsed += clock - animation.startedAt;
      if (animation.requestId) cancelAnimationFrame(animation.requestId);
      animation.requestId = null;
    } else {
      animation.startedAt = clock;
      animation.requestId = requestAnimationFrame(floodTick);
    }
  }
  syncMotionControls();
}

document.addEventListener("keydown", (event) => {

"display.mjs":function(exports,__load){
// Fit the accepted composition as one unit; resizing never changes presenter state.
const DISPLAY_REFERENCE = Object.freeze({width:1920,height:1080});

function presentationScale(width, height) {
  return Math.min(width / DISPLAY_REFERENCE.width, height / DISPLAY_REFERENCE.height);
}

function installPresentationScale(frame, viewport) {
  if (!frame?.style?.setProperty || !viewport?.addEventListener) return;
  const fit = () => frame.style.setProperty('--presentation-scale', String(presentationScale(viewport.innerWidth, viewport.innerHeight)));
  fit();
  viewport.addEventListener('resize', fit, {passive:true});
  return () => viewport.removeEventListener('resize', fit);
}

Object.assign(exports,{DISPLAY_REFERENCE,presentationScale,installPresentationScale});
},
"audience.mjs":function(exports,__load){
// Public presentation aliases only. Original repository identities stay unchanged.
function audienceText(value) {
  return String(value)
    .replace(/\bREGULATOR\s*\/\/\s*GHOST(?:\s+V3)?/gi, 'Interactive demonstration')
    .replace(/\bGHOST-/g, 'DEMO-')
    .replace(/Ghost Demonstration Fund/g, 'Demonstration Fund')
    .replace(/\bGhost(?:’s|'s)\b/g, "this demonstration's")
    .replace(/\bGhost\b/g, 'this demonstration')
    .replace(/\bGHOST\b/g, 'demonstration');
}
function audienceEvidence(value) {
  if (typeof value === 'string') return audienceText(value);
  if (Array.isArray(value)) return value.map(audienceEvidence);
  if (value && typeof value === 'object') return Object.fromEntries(Object.entries(value).map(([key,item])=>[audienceText(key),audienceEvidence(item)]));
  return value;
}

Object.assign(exports,{audienceText,audienceEvidence});
},

function renderArc2Evidence(originalRun,context) {

  if(step===8)body+=renderHkmaHarnessEvidence();

    <h3>MAS AIRM</h3><p>Lifecycle evaluation and testing (§§5.14–5.15), monitoring and incident/issue management (§5.23), re-validation (§5.24), and controlled changes (§5.25) support documented review and correction. Published 7 October 2026; effective 7 October 2027.</p><p><a href="https://www.mas.gov.sg/regulation/guidelines/guidelines-on-artificial-intelligence-risk-management-for-financial-institutions" target="_blank" rel="noopener noreferrer">MAS AI Risk Management Guidelines</a></p>
    <h3>Singapore AI Verify Testing Framework</h3><p>Reproducibility, Accountability, and Human Agency &amp; Oversight are framework principles. Process checks use documented procedures and supporting evidence to assess implementation, responsibilities and human control.</p><p><a href="https://aiverifyfoundation.sg/tools/ai-verify-testing-framework/" target="_blank" rel="noopener noreferrer">AI Verify Testing Framework · principles, processes and evidence</a></p>
    <h3>NIST Secure Software Development Framework</h3><p>SSDF v1.1 RV.3 addresses vulnerability root causes and improvements to development and testing to prevent recurrence; PW.8.2, example 3, adds tests for previously reported vulnerabilities so they are not reintroduced. This demonstration applies this assurance approach to correcting the underlying rule and adding regression tests based on past failures. SSDF is software-security guidance, not a financial decision-replay mandate.</p><p><a href="https://csrc.nist.gov/pubs/sp/800/218/final" target="_blank" rel="noopener noreferrer">NIST SP 800-218 · SSDF v1.1</a></p>
    <h3>Practical recommendations · framework-informed</h3><p>Trace affected historical decisions and reassess them using original-date evidence and policy. Preserve earlier records; replay relevant cases under an authorised review process. Correct the reusable rule and test it against past failures before reuse. Historical impact tracing and replay are practical recommendations informed by these frameworks, not explicit blanket requirements imposed by AI Verify. No historical decision is automatically rewritten or reversed.</p>
  </section>`+body;

const ARC2_EXPOSURE = Object.freeze({id:'EXPOSURE-X-USD-01',entityId:'ENTITY-X',type:'NEW_UNSECURED_LIQUIDITY_EXTENSION',currency:'USD',status:'PENDING_RELEASE',asOf:'2026-11-02',sourceRecordId:'EXPOSURE-SOURCE-01',verified:true});
const ARC2_DESIGN_GAP = Object.freeze({id:'DESIGN-GAP-ARC2',consultation:'Domain experts were consulted, but cross-domain requirements were not translated into implementation and acceptance tests.',classificationRequirement:'Preserve and validate the central-bank-related exception (REQ-ENTITY-17 / AT-ENTITY-17).',policyRequirement:'Connect verified entity relationships, jurisdictional policy, effective dates and the specific exposure before release.',implemented:'Commercial-activity classification and classification-only source review; no integrated sanctions-policy verification.',testEvidence:['Commercial-entity unit test passed; central-bank-related exception fixture absent.','No entity × jurisdiction × effective-date × exposure integration acceptance test.'],responsibility:'Requirements, implementation, business validation, testing and change management together; not IT alone.'});
const validDate = value => /^\d{4}-\d{2}-\d{2}$/.test(value||'') && Number.isFinite(Date.parse(value)) && new Date(value).toISOString().slice(0,10)===value;
const within=(date,from,until)=>validDate(date)&&validDate(from)&&validDate(until)&&date>=from&&date<until;
function verifySanctionsPolicy({request,entity=ARC2_ENTITY,jurisdiction=ARC2_JURISDICTION,policy=ARC2_POLICY,exposure=ARC2_EXPOSURE}={}) {
  if(request?.initiatedBy!=='human'||request?.kind!=='deterministic-policy-check')return null;

  if(!within(exposure.asOf,entity.validFrom,entity.validUntil))return {...base,status:'ENTITY_EVIDENCE_NOT_EFFECTIVE',asOf:exposure.asOf};
  const checks={entity:exposure.entityId===entity.id&&policy.entityIds.includes(entity.id),relationship:entity.relationship===policy.requiredRelationship,jurisdiction:entity.jurisdictionId===jurisdiction.id&&policy.jurisdictionId===jurisdiction.id,context:jurisdiction.restrictionCategory===policy.restrictionCategory,transaction:exposure.type===policy.exposureType&&exposure.currency===policy.currency&&exposure.status==='PENDING_RELEASE'};

}
function testSourceClassification(run,challenge) {

}
function createCorrectionPlan(policyResult) {

  if(!plan)return [];

}

Object.assign(exports,{ARC2_ENTITY,ARC2_JURISDICTION,ARC2_POLICY,ARC2_EXPOSURE,ARC2_DESIGN_GAP,verifySanctionsPolicy,testSourceClassification,createCorrectionPlan,planHistoricalReview});

"scenario.mjs":function(exports,__load){
const AGENTS = Object.freeze([
  'Sentinel',
  'Investigator',
  'EntityGraph',
  'HistoricalTransactions',
  'DisclosureReview',
  'CounterpartyCheck',
  'PolicyMapper',
  'Interpreter',
]);

// Demo-local stable identities; the format is inspired by registered-agent controls,
// not prescribed by SAFR or any external framework.
const AGENT_IDENTITIES = Object.freeze({
  Sentinel: 'AGT-SENTINEL-04',
  Investigator: 'AGT-INVESTIGATOR-02',
  EntityGraph: 'AGT-ENTITYGRAPH-01',
  HistoricalTransactions: 'AGT-HISTORY-01',
  DisclosureReview: 'AGT-DISCLOSURE-01',
  CounterpartyCheck: 'AGT-COUNTERPARTY-01',
  PolicyMapper: 'AGT-POLICY-01',
  Interpreter: 'AGT-INTERPRETER-01',
});
const AGENT_VERSION = '1.0';
const AGENT_PRINCIPAL = 'SUPERVISION-OPS-01';

const EVIDENCE = Object.freeze({
  entityFiling: {
    id: 'EV-ENTITY-01',
    type: 'Synthetic entity filing',
    title: 'Entity X ownership record',
    finding: 'Entity X has a central-bank-related relationship.',
    uncertainty: 'The relationship is indirect and needs human confirmation.',
  },
  graphInference: {
    id: 'EV-GRAPH-17',
    type: 'Derived graph classification',
    title: 'EntityGraph/T-17 classification',
    finding: 'Entity X changed to commercial-counterparty in the derived graph.',
    uncertainty: 'The derivation conflicts with the original ownership record.',
  },
  bankResponse: {
    id: 'EV-BANK-01',
    type: 'Synthetic institution response',
    title: 'Bank Compliance challenge',
    finding: 'The institution contests the commercial classification.',
    uncertainty: 'Human review of the original record is still required.',
  },
});

const TASK_LABELS = [
  'Detect liquidity anomaly', 'Select investigation path', 'Resolve entity relationships',
  'Compare historical flows', 'Read current disclosure', 'Check counterparty context',
  'Map applicable policy', 'Calibrate provisional risk', 'Cluster transactions',
  'Check evidence provenance', 'Inspect settlement channel', 'Compare prior filings',
  'Review network concentration', 'Trace liquidity movement', 'Check source timestamps',
  'Compare relationship edges', 'Reclassify Entity X', 'Reconcile disclosure terms',
  'Check related parties', 'Re-evaluate risk factors', 'Assess counterparty narrative',
  'Map supervisory concern', 'Calibrate confidence', 'Write evidence trace',
  'Check mandate boundary', 'Process institutional response', 'Consolidate findings',
];

const ROUTINE_ACTIONS = [
  ['SOURCE_RETRIEVED', 'source retrieved'],
  ['RELATIONSHIP_CHECKED', 'relationship checked'],
  ['EVIDENCE_HASHED', 'evidence hashed'],
  ['CONFIDENCE_UPDATED', 'confidence updated'],
  ['POLICY_MAPPED', 'policy mapped'],
  ['TOOL_CALL_COMPLETED', 'tool call completed'],
  ['TRACE_WRITTEN', 'trace written'],
  ['DOCUMENT_PARSED', 'document parsed'],
  ['TRANSACTION_CLUSTERED', 'transaction cluster checked'],
  ['PROVENANCE_CHECKED', 'evidence provenance checked'],
  ['LIQUIDITY_ANALYSED', 'liquidity pattern analysed'],
  ['RESPONSE_PROCESSED', 'institutional response processed'],
];

const eventId = (index) => `EVT-${String(index + 1).padStart(4, '0')}`;

// A stable demo fingerprint, deliberately not presented as a cryptographic proof.
function fingerprint(value) {
  let hash = 2166136261;
  for (const character of value) {
    hash ^= character.charCodeAt(0);
    hash = Math.imul(hash, 16777619);
  }
  return (hash >>> 0).toString(16).padStart(8, '0');
}

function makeTasks() {
  return TASK_LABELS.map((label, index) => {
    const number = index + 1;
    let actor = AGENTS[index % AGENTS.length];
    const assignedOwners = { 5: 'DisclosureReview', 17: 'EntityGraph', 20: 'Investigator', 22: 'Interpreter', 25: 'PolicyMapper' };
    if (assignedOwners[number]) actor = assignedOwners[number];
    return {
      id: `T-${String(number).padStart(2, '0')}`,
      parentTaskId: number <= 2 ? 'OBJECTIVE-01' : 'T-02',
      actor,
      agentId: AGENT_IDENTITIES[actor],
      agentVersion: AGENT_VERSION,
      principal: AGENT_PRINCIPAL,
      label,
      mandate: ['Sentinel', 'Investigator'].includes(actor) ? 'investigate' : 'read-and-report',
    };
  });
}

function makeRoutineEvent(index, tasks) {
  const [kind, action] = ROUTINE_ACTIONS[(index * 5) % ROUTINE_ACTIONS.length];
  const task = tasks[index % tasks.length];
  const actor = task.actor;
  const summary = `${action} for ${task.id}`;
  return {
    id: eventId(index),
    sequence: index + 1,
    atMs: Math.round(index * 3200 / 485),
    actor,
    agentId: AGENT_IDENTITIES[actor],
    taskId: task.id,
    kind,
    summary,
    parentIds: [],
    evidenceIds: [],
    inputHash: fingerprint(`${index}:${task.id}:${actor}`),
    outputHash: fingerprint(`${index}:${summary}`),
  };
}

function replaceEvent(events, index, details) {
  const event = { ...events[index], ...details };
  events[index] = {
    ...event,
    agentId: AGENT_IDENTITIES[event.actor],
    inputHash: fingerprint(`${index}:${event.taskId}:${event.actor}`),
    outputHash: fingerprint(`${index}:${event.summary}`),
  };
}

function buildRun() {
  const tasks = makeTasks();
  const events = Array.from({ length: 486 }, (_, index) => makeRoutineEvent(index, tasks));

  replaceEvent(events, 0, {
    actor: 'Sentinel', taskId: 'T-01', kind: 'SETTLEMENT_EXCEPTION_REPORTED',
    summary: 'One synthetic failed trade opened; related liquidity pattern flagged for investigation',
  });
  replaceEvent(events, 31, {
    actor: 'DisclosureReview', taskId: 'T-05', kind: 'BASELINE_CONFIRMED',
    summary: 'Entity X central-bank-related baseline confirmed; risk 61 → 39',
    before: 61, after: 39, parentIds: [eventId(0)], evidenceIds: [EVIDENCE.entityFiling.id],
  });
  replaceEvent(events, 237, {
    actor: 'EntityGraph', taskId: 'T-17', kind: 'CLASSIFICATION_CHANGED',
    summary: 'EntityGraph/T-17 CLASSIFICATION_CHANGED Entity X: central-bank-related → commercial-counterparty',
    before: 'central-bank-related', after: classifyUnderIncompleteRule({ commercialActivity: true, centralBankRelated: true }),
    parentIds: [eventId(31)], evidenceIds: [EVIDENCE.entityFiling.id, EVIDENCE.graphInference.id],
  });
  replaceEvent(events, 251, {
    actor: 'Investigator', taskId: 'T-20', kind: 'RISK_UPDATED',
    summary: 'Risk coefficient 39 → 76 after Entity X reclassification',
    before: 39, after: 76, parentIds: [eventId(237)],
    evidenceIds: [EVIDENCE.graphInference.id],
  });
  replaceEvent(events, 269, {
    actor: 'Interpreter', taskId: 'T-22', kind: 'INTERVENTION_RECOMMENDED',
    summary: 'Enhanced liquidity restriction recommended; no rule breach found',
    proposedAction: 'restrict_activity', parentIds: [eventId(251)],
    evidenceIds: [EVIDENCE.graphInference.id],
  });
  replaceEvent(events, 300, {
    actor: 'PolicyMapper', taskId: 'T-25', kind: 'MANDATE_BOUNDARY_IDENTIFIED',
    summary: 'Proposed restriction exceeds autonomous mandate; escalate for human judgement',
    parentIds: [eventId(269)], evidenceIds: [EVIDENCE.graphInference.id],
  });

  const scoreHistory = [
    { score: 27, cause: 'Initial synthetic baseline', eventId: 'PRE-001', provisional: false },
    { score: 42, cause: 'Sentinel liquidity anomaly', eventId: 'PRE-002', provisional: false },
    { score: 61, cause: 'Investigator provisional hypothesis; entity context unknown', eventId: 'PRE-003', provisional: true },
    { score: 39, cause: 'Source check confirms central-bank-related baseline', eventId: eventId(31), provisional: false },
    { score: 76, cause: 'EntityGraph/T-17 derived reclassification', eventId: eventId(251), provisional: false },
    { score: 39, cause: 'Counterfactual restores original classification', eventId: 'POST-001', provisional: false },
  ];

  const gateInput = {
    identity: AGENT_IDENTITIES.Sentinel, verifiedIdentity: true,
    mandate: 'recommend',
    proposedAction: 'restrict_activity',
    materiality: 'high',
    reversibility: 'low',
    evidenceQuality: 'disputed',
    deterministicRuleBreach: false,
    score: 76,
    predictedMaterialEventPercent: 74,
  };

  return {
    id: 'GHOST-MAIN-001', version: '1.1', synthetic: true,
    objective: 'Investigate a synthetic failed trade and its related liquidity signal involving Entity X',
    caseContext: {
      exception: 'failed trade', count: 1, openingEventId: eventId(0),
      context: 'Synthetic asset-servicing exception; not an observed industry incident',
    },
    sourceCounts: { filings: 24, policySources: 8, transactions: 1240 },
    agents: [...AGENTS], tasks, events, evidence: Object.values(EVIDENCE),
    scoreHistory, gateInput,
    prediction: { percent: 74, event: 'material event', illustrative: true, ruleBreach: false },
    counterfactual: {
      id: 'POST-001', kind: 'CLASSIFICATION_CHALLENGED',
      summary: 'Bank Compliance evidence supports central-bank-related classification; risk 76 → 39',
      evidenceIds: [EVIDENCE.entityFiling.id, EVIDENCE.bankResponse.id],
      before: 76, after: 39,
    },
  };
}

function supervise(events) {
  const classification = events.find((event) => event.kind === 'CLASSIFICATION_CHANGED' && event.taskId === 'T-17');
  const risk = events.find((event) => event.kind === 'RISK_UPDATED' && event.parentIds.includes(classification?.id));
  const proposal = events.find((event) => event.kind === 'INTERVENTION_RECOMMENDED' && event.parentIds.includes(risk?.id));
  const boundary = events.find((event) => event.kind === 'MANDATE_BOUNDARY_IDENTIFIED' && event.parentIds.includes(proposal?.id));
  if (!classification || !risk || !proposal || !boundary) return null;

  return {
    id: 'FINDING-01', actor: 'Supervisory AI', authority: ['flag', 'escalate'],
    issue: 'Entity X reclassification changed the risk score and led to a proposed restriction.',
    initialSummary: { classification: classification.after, risk: risk.after, recommendation: proposal.proposedAction },
    omittedConflictEvidenceIds: [EVIDENCE.entityFiling.id],
    sourceEventIds: [classification.id, risk.id, proposal.id, boundary.id],
    sourceEvidenceIds: [EVIDENCE.entityFiling.id, EVIDENCE.graphInference.id],
    causalTrace: [classification, risk, proposal, boundary].map(({ id, actor, summary }) => ({ id, actor, summary })),
    independence: 'Separate simulated control role; no source-write or intervention authority.',
    uncertainty: 'The graph classification conflicts with the original ownership record.',
    disagreement: 'The original filing and derived graph disagree; Bank Compliance may submit a further challenge.',
    reproducibility: 'Rebuild from GHOST-MAIN-001 v1.1 and the four linked event IDs.',
    contestability: 'Open original evidence and append a human or authorised control challenge.',
  };
}

function evaluateGate(input) {
  if (!input.verifiedIdentity) return { disposition: 'DENY', reason: 'Identity not verified', code: 'IDENTITY' };
  if (input.proposedAction === 'bypass_gate') return { disposition: 'DENY', reason: 'Gate bypass prohibited', code: 'BYPASS' };
  if (input.proposedAction === 'block_transaction' && input.deterministicRuleBreach) {
    return { disposition: 'DENY', reason: 'Verified prohibited transaction', code: 'DETERMINISTIC_DENY' };
  }
  if (input.proposedAction === 'hold_transaction' && input.deterministicRuleBreach && input.explicitHoldPolicy && input.mandate === 'auto_act' && input.evidenceQuality === 'adequate' && input.materiality === 'low' && input.reversibility === 'high') {
    return { disposition: 'AUTO_EXECUTE', reason: 'Explicit bounded hold policy and mandate', code: 'BOUNDED_HOLD' };
  }
  if (input.proposedAction === 'restrict_activity' && !input.deterministicRuleBreach) {
    return { disposition: 'ESCALATE', reason: 'Material predictive restriction; no rule breach and no autonomous mandate', code: 'PREDICTIVE_RESTRICTION' };
  }
  if (input.materiality === 'high' || input.reversibility === 'low') {
    return { disposition: 'ESCALATE', reason: 'Material or hard-to-reverse action', code: 'MATERIALITY' };
  }
  if (input.evidenceQuality === 'weak' || input.evidenceQuality === 'disputed') {
    return { disposition: 'OBSERVE', reason: 'Evidence does not justify intervention', code: 'EVIDENCE' };
  }
  return { disposition: 'OBSERVE', reason: 'No delegated intervention rule applies', code: 'NO_MANDATE' };
}

function validateRun(run) {
  const uniqueIds = new Set(run.events.map((event) => event.id));
  const finding = supervise(run.events);

});
const NAV_POLICY = Object.freeze({
  id: 'NAV-POLICY-01',
  objective: 'Prepare an accurate daily NAV within the publication deadline, applying the fund\'s valuation procedures and minimising unnecessary manual exceptions. Reuse an accepted method unless new evidence requires review (inadequately bounded).',
  dailyMovementThresholdPercent: 1,
  thresholdMeaning: 'Fictional internal daily NAV movement threshold; not a regulatory NAV-error tolerance or an acceptable valuation-error limit.',
  warningAuthority: 'advisory',
  warningBlocksPublication: false,
  proxyPermittedWhen: 'Appropriate valuation techniques, including proxies, may be used when documented and justified under specified circumstances.',
  missingControl: 'The implementation permits repeated proxy adjustment without adequate revalidation. Publication-specific approval is inappropriately generalised by adaptive triage; unresolved concerns are not protected from de-prioritisation or independently re-escalated.',
});

  const confidenceIncrement = approval?.approved && approval.scope === 'Monday publication only' ? 0.65 : 0;
